    <!-- JavaScript Logic -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let currentMode = 'try'; // 'try' or 'arb'
            const API_URL = 'https://open.er-api.com/v6/latest/TRY';
            const currenciesToTrack = ['USD', 'EUR', 'GBP', 'CHF', 'JPY', 'CAD'];
            let latestRates = {};

            // DOM Elements
            const tabTry = document.getElementById('tab-try');
            const tabArb = document.getElementById('tab-arb');
            const tryInputs = document.getElementById('try-inputs');
            const arbInputs = document.getElementById('arb-inputs');

            const amountInput = document.getElementById('amount');
            const currencySelect = document.getElementById('currency');
            const operationSelect = document.getElementById('operation-type');
            
            const fromCurrencySelect = document.getElementById('from-currency');
            const toCurrencySelect = document.getElementById('to-currency');
            const convertBtn = document.getElementById('convert-btn');
            const swapBtn = document.getElementById('swap-btn');
            
            const loadingIndicator = document.getElementById('loading');
            const resultContainer = document.getElementById('result-container');
            const exchangeRateInfo = document.getElementById('exchange-rate-info');
            const finalResult = document.getElementById('final-result');
            const profitInfo = document.getElementById('profit-info');
            const lastUpdatedInfo = document.getElementById('last-updated');
            
            const errorContainer = document.getElementById('error-message');
            const errorText = document.getElementById('error-text');

            // Tab Switchers
            tabTry.addEventListener('click', () => {
                currentMode = 'try';
                tabTry.className = 'flex-1 py-2.5 px-4 text-sm font-bold rounded-xl bg-white shadow-sm text-orange-600 transition-all duration-200';
                tabArb.className = 'flex-1 py-2.5 px-4 text-sm font-semibold rounded-xl text-gray-600 hover:text-gray-900 transition-all duration-200';
                
                tryInputs.classList.remove('hidden');
                tryInputs.classList.add('flex');
                arbInputs.classList.add('hidden');
                arbInputs.classList.remove('flex');
                
                hideResult();
            });

            tabArb.addEventListener('click', () => {
                currentMode = 'arb';
                tabArb.className = 'flex-1 py-2.5 px-4 text-sm font-bold rounded-xl bg-white shadow-sm text-orange-600 transition-all duration-200';
                tabTry.className = 'flex-1 py-2.5 px-4 text-sm font-semibold rounded-xl text-gray-600 hover:text-gray-900 transition-all duration-200';
                
                arbInputs.classList.remove('hidden');
                arbInputs.classList.add('flex');
                tryInputs.classList.add('hidden');
                tryInputs.classList.remove('flex');
                
                hideResult();
            });

            async function fetchRates() {
                showLoading();
                hideError();
                try {
                    const response = await fetch(API_URL);
                    if (!response.ok) throw new Error('Döviz kurları alınamadı.');
                    
                    const data = await response.json();
                    
                    if (data.result === "success" && data.rates) {
                        currenciesToTrack.forEach(curr => {
                            if (data.rates[curr]) {
                                const rateToTry = 1 / data.rates[curr];
                                latestRates[curr] = {
                                    rate: rateToTry,
                                    name: getCurrencyName(curr),
                                    date: data.time_last_update_utc 
                                };
                            }
                        });
                        populateDropdown();
                    } else {
                        throw new Error('API yanıtı geçersiz.');
                    }
                    hideLoading();
                } catch (error) {
                    hideLoading();
                    showError(`Bağlantı hatası: Kurlar yüklenemedi. (${error.message})`);
                }
            }
            
            function getCurrencyName(code) {
                const names = {
                    'USD': 'Amerikan Doları',
                    'EUR': 'Euro',
                    'GBP': 'İngiliz Sterlini',
                    'CHF': 'İsviçre Frangı',
                    'JPY': 'Japon Yeni',
                    'CAD': 'Kanada Doları'
                };
                return names[code] || code;
            }

            function populateDropdown() {
                let optionsHtml = '';
                for (const [code, data] of Object.entries(latestRates)) {
                    optionsHtml += `<option value="${code}">${code} - ${data.name}</option>`;
                }
                currencySelect.innerHTML = optionsHtml;
                
                // Arbitrage is specifically EUR and USD only
                fromCurrencySelect.innerHTML = `
                    <option value="EUR">EUR - ${latestRates['EUR']?.name || 'Euro'}</option>
                    <option value="USD">USD - ${latestRates['USD']?.name || 'Amerikan Doları'}</option>
                `;
                toCurrencySelect.innerHTML = `
                    <option value="USD">USD - ${latestRates['USD']?.name || 'Amerikan Doları'}</option>
                    <option value="EUR">EUR - ${latestRates['EUR']?.name || 'Euro'}</option>
                `;
                
                fromCurrencySelect.value = 'EUR';
                toCurrencySelect.value = 'USD';
            }

            function calculateConversion() {
                const amount = parseFloat(amountInput.value);
                const margin = 0.008; // 8 per thousand (binde 8)

                if (isNaN(amount) || amount <= 0) {
                    showError('Lütfen geçerli bir miktar girin (0\'dan büyük).');
                    return;
                }
                
                hideResult();
                hideError();

                if (currentMode === 'try') {
                    // --- TRY Logic ---
                    const currency = currencySelect.value;
                    const operation = operationSelect.value;
                    
                    if (!latestRates[currency]) { showError('Döviz verisi bulunamadı.'); return; }

                    const baseRate = latestRates[currency].rate;
                    let appliedRate = 0;
                    let profitPerUnit = 0;
                    let actionText = '';
                    
                    if (operation === 'boz') {
                        // Buy from customer at lower rate
                        appliedRate = baseRate * (1 - margin);
                        profitPerUnit = baseRate - appliedRate;
                        actionText = 'Müşteriye Ödenecek (₺)';
                    } else {
                        // Sell to customer at higher rate
                        appliedRate = baseRate * (1 + margin);
                        profitPerUnit = appliedRate - baseRate;
                        actionText = 'Müşteriden Alınacak (₺)';
                    }

                    const totalAmount = amount * appliedRate;
                    const totalProfitTry = amount * profitPerUnit;
                    
                    displayResult({
                        total: totalAmount,
                        appliedRate: appliedRate,
                        baseRate: baseRate,
                        currencyFrom: currency,
                        currencyTo: '₺',
                        profitTry: totalProfitTry,
                        actionText: actionText,
                        date: latestRates[currency].date
                    });

                } else {
                    // --- Arbitrage Logic ---
                    const fromCurr = fromCurrencySelect.value;
                    const toCurr = toCurrencySelect.value;
                    
                    if (fromCurr === toCurr) {
                        showError('Arbitraj için iki farklı döviz seçmelisiniz.');
                        return;
                    }
                    if (!latestRates[fromCurr] || !latestRates[toCurr]) { showError('Döviz verisi bulunamadı.'); return; }

                    const rateFromTRY = latestRates[fromCurr].rate;
                    const rateToTRY = latestRates[toCurr].rate;
                    
                    // Cross rate calculation
                    const baseCrossRate = rateFromTRY / rateToTRY;
                    const appliedCrossRate = baseCrossRate * (1 - margin);
                    
                    const trueAmountTo = amount * baseCrossRate;
                    const appliedAmountTo = amount * appliedCrossRate;
                    
                    // Profit converted back to TRY for uniform display
                    const profitToCurr = trueAmountTo - appliedAmountTo;
                    const profitTry = profitToCurr * rateToTRY;
                    
                    displayResult({
                        total: appliedAmountTo,
                        appliedRate: appliedCrossRate,
                        baseRate: baseCrossRate,
                        currencyFrom: fromCurr,
                        currencyTo: toCurr,
                        profitTry: profitTry,
                        actionText: 'Müşteriye Verilecek (' + toCurr + ')',
                        date: latestRates[fromCurr].date
                    });
                }
            }

            function displayResult(data) {
                const rateFormatter = new Intl.NumberFormat('tr-TR', { maximumFractionDigits: 4, minimumFractionDigits: 4 });
                const currencyFormatter = new Intl.NumberFormat('tr-TR', { maximumFractionDigits: 2, minimumFractionDigits: 2 });
                
                const toSymbol = data.currencyTo === '₺' ? '₺' : data.currencyTo;

                exchangeRateInfo.innerHTML = `
                    Piyasa Kuru: 1 ${data.currencyFrom} = <strong>${rateFormatter.format(data.baseRate)} ${toSymbol}</strong><br>
                    <span class="font-bold text-orange-600">Uygulanan Kur: 1 ${data.currencyFrom} = ${rateFormatter.format(data.appliedRate)} ${toSymbol}</span>
                `;
                
                finalResult.innerHTML = `
                    <div class="text-xs text-gray-500 font-semibold uppercase tracking-wider mb-1">${data.actionText}</div>
                    <span class="text-orange-500">${currencyFormatter.format(data.total)}</span> <span class="text-xl text-gray-600 font-bold">${toSymbol}</span>
                `;
                
                profitInfo.innerHTML = `
                    <div class="bg-emerald-100/90 text-emerald-800 text-sm font-bold px-3.5 py-2 rounded-xl inline-flex items-center gap-1 shadow-sm border border-emerald-200">
                        <i class="fa-solid fa-piggy-bank text-emerald-600"></i> Tahmini Kâr: <span>${currencyFormatter.format(data.profitTry)} ₺</span>
                    </div>
                `;
                
                const dateObj = new Date(data.date);
                const formattedDate = dateObj.toLocaleDateString('tr-TR', { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute:'2-digit' });
                lastUpdatedInfo.textContent = `Güncelleme: ${formattedDate} UTC`;
                
                resultContainer.classList.remove('hidden');
                void resultContainer.offsetWidth; 
                resultContainer.classList.add('fade-in');
            }

            // UI Helper Functions
            function showLoading() {
                loadingIndicator.classList.remove('hidden');
                loadingIndicator.classList.add('flex');
                convertBtn.disabled = true;
                convertBtn.classList.add('opacity-75', 'cursor-not-allowed');
            }

            function hideLoading() {
                loadingIndicator.classList.add('hidden');
                loadingIndicator.classList.remove('flex');
                convertBtn.disabled = false;
                convertBtn.classList.remove('opacity-75', 'cursor-not-allowed');
            }

            function hideResult() {
                resultContainer.classList.add('hidden');
                resultContainer.classList.remove('fade-in');
            }

            function showError(msg) {
                errorText.textContent = msg;
                errorContainer.classList.remove('hidden');
                hideResult();
            }

            function hideError() {
                errorContainer.classList.add('hidden');
            }

            // Quick Swap Button Click Handler
            swapBtn.addEventListener('click', () => {
                const temp = fromCurrencySelect.value;
                fromCurrencySelect.value = toCurrencySelect.value;
                toCurrencySelect.value = temp;
                
                if (!resultContainer.classList.contains('hidden')) {
                    calculateConversion();
                }
            });

            // Event Listeners
            convertBtn.addEventListener('click', calculateConversion);
            amountInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') calculateConversion();
            });

            if ('serviceWorker' in navigator) {
                const swCode = `
                    self.addEventListener('install', (e) => { self.skipWaiting(); });
                    self.addEventListener('fetch', (e) => {});
                `;
                const blob = new Blob([swCode], {type: 'application/javascript'});
                const swUrl = URL.createObjectURL(blob);
                
                navigator.serviceWorker.register(swUrl).catch(err => {
                    console.log('SW registration failed: ', err);
                });
            }

            // Initialize data on load
            fetchRates();
        });
    </script>
</body>
</html>

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // DOM Elements

            const errorContainer = document.getElementById('error-message');
            const errorText = document.getElementById('error-text');

            const API_URL = 'https://open.er-api.com/v6/latest/TRY';
            const currenciesToTrack = ['USD', 'EUR', 'GBP', 'CHF', 'JPY', 'CAD'];
            let latestRates = {};

            tabTry.addEventListener('click', () => {
                currentMode = 'try';
                tabTry.classList.add('bg-white', 'shadow', 'text-orange-500', 'font-bold');
                tabTry.classList.remove('text-gray-500', 'font-semibold');
                
                tabArb.classList.remove('bg-white', 'shadow', 'text-orange-500', 'font-bold');

                tryInputs.classList.remove('hidden');

                arbInputs.classList.remove('flex');
                
                hideResult();
            });

            tabArb.addEventListener('click', () => {
                currentMode = 'arb';
                tabArb.classList.add('bg-white', 'shadow', 'text-orange-500', 'font-bold');
                tabArb.classList.remove('text-gray-500', 'font-semibold');
                
                tabTry.classList.remove('bg-white', 'shadow', 'text-orange-500', 'font-bold');
                tabTry.classList.add('text-gray-500', 'font-semibold');
                
                arbInputs.classList.remove('hidden');
                arbInputs.classList.add('flex');
                tryInputs.classList.add('hidden');
                tryInputs.classList.remove('flex');
                
                hideResult();
            });

            async function fetchRates() {
                showLoading();
                hideError();
                try {
                    const response = await fetch(API_URL);
                    if (!response.ok) throw new Error('Döviz kurları alınamadı.');
                    
                    const data = await response.json();
                    
                    if (data.result === "success" && data.rates) {
                        currenciesToTrack.forEach(curr => {
                            if (data.rates[curr]) {
                                const rateToTry = 1 / data.rates[curr];
                                latestRates[curr] = {
                                    rate: rateToTry,
                                    name: getCurrencyName(curr),
                                    date: data.time_last_update_utc 
                                };
                            }
                        });
                        populateDropdown();
                    } else {
                        throw new Error('API yanıtı geçersiz.');
                    }
                    hideLoading();
                } catch (error) {
                    hideLoading();
                    showError(`Bağlantı hatası: Kurlar yüklenemedi. (${error.message})`);
                }
            }
            
            function getCurrencyName(code) {
                const names = {
                    'USD': 'Amerikan Doları',
                    'EUR': 'Euro',
                    'GBP': 'İngiliz Sterlini',
                    'CHF': 'İsviçre Frangı',
                    'JPY': 'Japon Yeni',
                    'CAD': 'Kanada Doları'
                };
                return names[code] || code;
            }

            function populateDropdown() {
                let optionsHtml = '';
                for (const [code, data] of Object.entries(latestRates)) {
                    optionsHtml += `<option value="${code}">${code} - ${data.name}</option>`;
                }

                currencySelect.innerHTML = optionsHtml;
                
                // Arbitraj için SADECE EUR ve USD
                let arbOptionsHtml = '';
                if (latestRates['EUR']) arbOptionsHtml += `<option value="EUR">EUR - ${latestRates['EUR'].name}</option>`;
                if (latestRates['USD']) arbOptionsHtml += `<option value="USD">USD - ${latestRates['USD'].name}</option>`;
                
                fromCurrencySelect.innerHTML = arbOptionsHtml;
                toCurrencySelect.innerHTML = arbOptionsHtml;
                
                // Select different defaults for Arbitraj
                if(latestRates['EUR'] && latestRates['USD']) {
                    fromCurrencySelect.value = 'EUR';
                    toCurrencySelect.value = 'USD';
                }
            }

            function calculateConversion() {
                const amount = parseFloat(amountInput.value);
                const margin = 0.008; // 8 per thousand (binde 8)

                if (isNaN(amount) || amount <= 0) {
                    showError('Lütfen geçerli bir miktar girin (0\'dan büyük).');
                    return;
                }
                
                hideResult();
                hideError();

                if (currentMode === 'try') {
                    // --- TRY Logic ---
                    const currency = currencySelect.value;
                    const operation = operationSelect.value;
                    
                    if (!latestRates[currency]) { showError('Veri bulunamadı.'); return; }

                    const baseRate = latestRates[currency].rate;
                    let appliedRate = 0;
                    let profitPerUnit = 0;
                    let actionText = '';
                    
                    if (operation === 'boz') {
                        // We buy from customer at lower rate
                        appliedRate = baseRate * (1 - margin);
                        profitPerUnit = baseRate - appliedRate;
                        actionText = 'Müşteriye Ödenecek (₺)';
                    } else {
                        // We sell to customer at higher rate
                        appliedRate = baseRate * (1 + margin);
                        profitPerUnit = appliedRate - baseRate;
                        actionText = 'Müşteriden Alınacak (₺)';
                    }

                    const totalAmount = amount * appliedRate;
                    const totalProfitTry = amount * profitPerUnit;
                    
                    displayResult({
                        total: totalAmount,
                        appliedRate: appliedRate,
                        baseRate: baseRate,
                        currencyFrom: currency,
                        currencyTo: '₺',
                        profitTry: totalProfitTry,
                        actionText: actionText,
                        date: latestRates[currency].date
                    });

                } else {
                    // --- Arbitraj Logic ---
                    const fromCurr = fromCurrencySelect.value;
                    const toCurr = toCurrencySelect.value;
                    
                    if (fromCurr === toCurr) {
                        showError('Arbitraj için farklı iki döviz seçmelisiniz.');
                        return;
                    }
                    if (!latestRates[fromCurr] || !latestRates[toCurr]) { showError('Veri bulunamadı.'); return; }

                    const rateFromTRY = latestRates[fromCurr].rate;
                    const rateToTRY = latestRates[toCurr].rate;
                    
                    // Cross rate: 1 unit of fromCurr = X units of toCurr
                    const baseCrossRate = rateFromTRY / rateToTRY;
                    
                    // We take our 0.8% margin by offering a lower cross rate to the customer
                    // (They give us fromCurr, we give them LESS toCurr than market)
                    const appliedCrossRate = baseCrossRate * (1 - margin);
                    
                    const trueAmountTo = amount * baseCrossRate;
                    const appliedAmountTo = amount * appliedCrossRate;
                    
                    // Profit in 'toCurr'
                    const profitToCurr = trueAmountTo - appliedAmountTo;
                    // Convert profit to TRY for standardized display
                    const profitTry = profitToCurr * rateToTRY;
                    
                    displayResult({
                        total: appliedAmountTo,
                        appliedRate: appliedCrossRate,
                        baseRate: baseCrossRate,
                        currencyFrom: fromCurr,
                        currencyTo: toCurr,
                        profitTry: profitTry,
                        actionText: 'Müşteriye Verilecek (' + toCurr + ')',
                        date: latestRates[fromCurr].date
                    });
                }
            }

                const currencyFormatter = new Intl.NumberFormat('tr-TR', { maximu
